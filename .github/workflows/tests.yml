name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        filament: ['^4.0', '^5.0']
        laravel: ['11.*', '12.*', '13.*']
        stability: [prefer-lowest, prefer-stable]
        exclude:
          # Laravel 13 requires PHP 8.3.
          - php: '8.2'
            laravel: '13.*'
          # Filament 5 needs Livewire 4, whose Pest plugin needs PHP 8.3, so the
          # test tools cannot install on 8.2. The package itself still does.
          - php: '8.2'
            filament: '^5.0'
          # The lowest versions of Laravel 11 and 12 predate PHP 8.5.
          - php: '8.5'
            stability: prefer-lowest

    name: PHP ${{ matrix.php }} · Filament ${{ matrix.filament }} · Laravel ${{ matrix.laravel }} · ${{ matrix.stability }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, zip, xml, fileinfo, pdo_sqlite, sqlite3
          coverage: none

      - name: Install dependencies
        env:
          FILAMENT: ${{ matrix.filament }}
          LARAVEL: ${{ matrix.laravel }}
          STABILITY: ${{ matrix.stability }}
        run: |
          # Laravel 11 is end-of-life and every 11.x release has open security
          # advisories, which Composer now refuses to install. Test it anyway,
          # in this job only, so users still on 11 know the package works.
          if [[ "${LARAVEL}" == 11.* ]]; then
            php -r '$f = "composer.json"; $c = json_decode(file_get_contents($f), true); $c["config"]["policy"]["advisories"]["block"] = false; $c["config"]["audit"]["block-insecure"] = false; file_put_contents($f, json_encode($c, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES));'
          fi
          composer require "filament/filament:${FILAMENT}" "laravel/framework:${LARAVEL}" --no-interaction --no-update
          composer update "--${STABILITY}" --prefer-dist --no-interaction --with-all-dependencies

      - name: Show resolved versions
        run: |
          for package in filament/filament laravel/framework livewire/livewire openspout/openspout league/csv; do
            composer show "$package" | grep -E '^(name|versions)'
          done

      - name: Tests
        run: vendor/bin/pest
